name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do frontend, builds e Firebase Hosting
        run: node --test tests/*.cjs
      - name: Contratos do Supabase num Postgres descartável (PGlite)
        run: |
          npm install --no-save @electric-sql/pglite@0.2.17
          node supabase/producao/validar-contratos.cjs .
      - name: Contratos v2 (cadastros e despesas confidenciais)
        run: node supabase/v2/validar-v2.cjs .
      - name: Contratos v3 (cadastros auxiliares)
        run: node supabase/v3/validar-v3.cjs .
      - name: Contratos v4 (estoque)
        run: node supabase/v4/validar-v4.cjs .
      - name: Contratos v5 (compras)
        run: node supabase/v5/validar-v5.cjs .
      - name: Contratos v6 (consumo na obra)
        run: node supabase/v6/validar-v6.cjs .
      - name: Contratos v7 (frota, ausências e cotações)
        run: node supabase/v7/validar-v7.cjs .
      - name: Contratos v8 (requisição de materiais)
        run: node supabase/v8/validar-v8.cjs .
      - name: Contratos v9 (usuários e permissões)
        run: node supabase/v9/validar-v9.cjs .
