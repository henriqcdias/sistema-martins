name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do frontend, builds e Firebase Hosting
        run: node --test tests/*.cjs
      - name: Contratos do Supabase num Postgres descartável (PGlite)
        run: |
          npm install --no-save @electric-sql/pglite@0.2.17
          node supabase/producao/validar-contratos.cjs .
      - name: Contratos v2 (cadastros e despesas confidenciais)
        run: node supabase/v2/validar-v2.cjs .
      - name: Contratos v3 (cadastros auxiliares)
        run: node supabase/v3/validar-v3.cjs .
      - name: Contratos v4 (estoque)
        run: node supabase/v4/validar-v4.cjs .
      - name: Contratos v5 (compras)
        run: node supabase/v5/validar-v5.cjs .
      - name: Contratos v6 (consumo na obra)
        run: node supabase/v6/validar-v6.cjs .
      - name: Contratos v7 (frota, ausências e cotações)
        run: node supabase/v7/validar-v7.cjs .
      - name: Contratos v8 (requisição de materiais)
        run: node supabase/v8/validar-v8.cjs .
      - name: Contratos v9 (usuários e permissões)
        run: node supabase/v9/validar-v9.cjs .
      - name: Contratos v10 (contas a receber)
        run: node supabase/v10/validar-v10.cjs .
      - name: Contratos v11 (devolução ao fornecedor)
        run: node supabase/v11/validar-v11.cjs .
      - name: Isolamento entre empresas
        run: node supabase/isolamento/validar-isolamento.cjs .
      - name: Contratos v12 (gastos da obra)
        run: node supabase/v12/validar-v12.cjs .
      - name: Contratos v13 (backup e restauração)
        run: node supabase/v13/validar-v13.cjs .
      - name: Contratos v14 (fluxo do orçamento)
        run: node supabase/v14/validar-v14.cjs .
      - name: Contratos v15 (parcelas, custo congelado, relatórios financeiros)
        run: node supabase/v15/validar-v15.cjs .
      - name: Contratos v16 (conciliação bancária)
        run: node supabase/v16/validar-v16.cjs .
