name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do frontend, builds e Firebase Hosting
        run: node --test tests/*.cjs
      - name: Contratos do Supabase num Postgres descartável (PGlite)
        run: |
          npm install --no-save @electric-sql/pglite@0.2.17
          node supabase/producao/validar-contratos.cjs .
      - name: Contratos v2 (cadastros e despesas confidenciais)
        run: node supabase/v2/validar-v2.cjs .
      - name: Contratos v3 (cadastros auxiliares)
        run: node supabase/v3/validar-v3.cjs .
